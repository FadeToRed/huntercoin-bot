name: Keep Alive

on:
  schedule:
    - cron: '0 12 1 * *'  # ogni 1° del mese a mezzogiorno

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep repository alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last keep-alive: $(date -u)" > .github/keep-alive.txt
          git add .github/keep-alive.txt
          git commit -m "chore: keep-alive [skip ci]" || echo "Nothing to commit"
          git push
